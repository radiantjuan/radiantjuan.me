name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14'  # Specify the Node.js version you need
      
    - name: Install dependencies
      run: npm install
      
    - name: Build the application
      run: npm run build
      
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag radiantcjuan/radiantjuandotme:latest

    - name: Save Docker image as tar file
      run: docker save radiantcjuan/radiantjuandotme:latest -o docker-image.tar
      
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: docker-image.tar

  push:
    runs-on: ubuntu-latest
    needs: build  # Ensures this job runs only after the build job succeeds

    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Load Docker image
      run: docker load -i /path/to/docker-image.tar  # Adjust the path accordingly

    - name: Push Docker image to Docker Hub
      run: docker push radiantcjuan/radiantjuandotme:latest
